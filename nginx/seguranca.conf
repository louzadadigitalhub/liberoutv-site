# Cabecalhos de seguranca de toda resposta do site, inclusive as de erro.

# o navegador so volta a este endereco por HTTPS
add_header Strict-Transport-Security "max-age=31536000" always;
# o tipo do arquivo e o que o servidor diz, sem adivinhacao
add_header X-Content-Type-Options "nosniff" always;
# o site nao pode ser embutido em pagina de terceiros
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# So carrega o que e do proprio site. Script embutido no HTML nao roda: os
# scripts ficam em assets/gate.js e assets/site.js. O estilo embutido segue
# permitido. "data:" e do grao do fundo; "blob:" e do video do topo, que a
# pagina baixa inteiro antes de tocar.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
