# Site estatico atras do proxy do EasyPanel, que cuida do HTTPS e do
# redirecionamento de http para https. Aqui ficam os cabecalhos de seguranca
# e o que nao deve ser servido.

# sem a versao do nginx no cabecalho Server e nas paginas de erro
server_tokens off;

# ---------------------------------------------------------------- provedor de demonstracao
# O site responde tambem como um servidor Xtream Codes de demonstracao, para a
# revisao das lojas: o codigo do painel que aponta para https://app.liberoutv.com
# e a conta revisao/liberou2026 abrem so conteudo de licenca livre (filmes
# abertos da Blender, videos de teste da Apple e da Mux). As respostas sao os
# arquivos de demo/api (gerados por demo/gerar.py); os videos redirecionam para
# as fontes oficiais (demo-midia.conf, gerado junto).
include /etc/nginx/demo-midia.conf;

map "$arg_username:$arg_password" $demo_conta {
    default 0;
    "revisao:liberou2026" 1;
}
# so numeros entram no nome do arquivo
map $arg_category_id $demo_cat {
    default "";
    "~^(?<c>[0-9]{1,4})$" "_$c";
}
map $arg_vod_id $demo_vod {
    default 0;
    "~^(?<v>[0-9]{1,6})$" $v;
}
map $arg_series_id $demo_serie {
    default 0;
    "~^(?<s>[0-9]{1,6})$" $s;
}
map "$demo_conta:$arg_action" $demo_api {
    default vazio;
    "~^0:" negado;
    "1:" auth;
    "1:get_live_categories" live_categories;
    "1:get_vod_categories" vod_categories;
    "1:get_series_categories" series_categories;
    "1:get_live_streams" "live_streams$demo_cat";
    "1:get_vod_streams" "vod_streams$demo_cat";
    "1:get_series" "series$demo_cat";
    "1:get_vod_info" "vod_info_$demo_vod";
    "1:get_series_info" "series_info_$demo_serie";
    "1:get_short_epg" epg;
    "1:get_simple_data_table" epg;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # O add_header de um bloco location substitui os do bloco de fora. Por
    # isso os cabecalhos de seguranca moram num arquivo so, incluido aqui e
    # em todo bloco que define cabecalho proprio.
    include /etc/nginx/seguranca.conf;

    # /downloads, sem a barra, leva a pagina de downloads. Os arquivos em
    # /downloads/ nao passam por aqui: o proxy do EasyPanel manda esse caminho
    # para o servico "downloads", que guarda os instaladores num volume.
    location = /downloads {
        include /etc/nginx/seguranca.conf;
        absolute_redirect off;
        return 301 /downloads.html;
    }

    # /pagar e /pagos, sem .html: taxa do novo acesso (cliente) e lista de quem pagou (dono)
    location = /pagar {
        include /etc/nginx/seguranca.conf;
        absolute_redirect off;
        return 301 /pagar.html;
    }
    location = /pagos {
        include /etc/nginx/seguranca.conf;
        absolute_redirect off;
        return 301 /pagos.html;
    }

    # o provedor de demonstracao (ver o comeco do arquivo)
    location = /player_api.php {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files /demo-api/$demo_api.json /demo-api/vazio.json;
    }
    location ~ ^/(live|movie|series)/ {
        include /etc/nginx/seguranca.conf;
        if ($demo_midia = "") {
            return 404;
        }
        return 302 $demo_midia;
    }

    # arquivo oculto nunca e servido (.git, .env, .DS_Store)
    location ~ /\. {
        return 404;
    }

    # Paginas e scripts sao conferidos a cada visita: quem muda a politica
    # ou o estado das lojas ve a mudanca na hora, sem copia velha no navegador
    location ~* \.(html|js)$ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }
}
